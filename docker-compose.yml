# Local / small-team self-hosted stack.
# `docker compose up` brings up Postgres, the NestJS backend (REST + the
# encrypted Yjs WebSocket relay on one port), the built web editor, a Caddy
# reverse proxy (TLS in prod), and an optional test OpenLDAP directory.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-obsidian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-obsidian}
      POSTGRES_DB: ${POSTGRES_DB:-obsidian_cloud}
    # Not published by default: the DB is only reached over the internal compose
    # network. Uncomment to expose it for local tooling on a trusted host.
    # ports:
    #   - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-obsidian} -d ${POSTGRES_DB:-obsidian_cloud}']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      # The backend is only reachable through Caddy here, so trusting the
      # first proxy hop (X-Forwarded-For) is safe and keeps per-IP rate
      # limiting meaningful.
      TRUST_PROXY: '1'
      DATABASE_URL: postgresql://${POSTGRES_USER:-obsidian}:${POSTGRES_PASSWORD:-obsidian}@postgres:5432/${POSTGRES_DB:-obsidian_cloud}?schema=public
      # NODE_ENV=production above: the backend refuses to boot if these are left
      # at their (public, in-repo) dev defaults. Set strong values in .env.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-604800}
      AUTH_PROVIDERS: ${AUTH_PROVIDERS:-local}
      # bitnami/openldap listens on 1389 inside the container (see the openldap
      # service). The test profile is reachable at ldap://openldap:1389.
      LDAP_URL: ${LDAP_URL:-ldap://openldap:1389}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-cn=admin,dc=example,dc=org}
      LDAP_BIND_CREDENTIALS: ${LDAP_BIND_CREDENTIALS:-admin}
      LDAP_SEARCH_BASE: ${LDAP_SEARCH_BASE:-ou=people,dc=example,dc=org}
      LDAP_SEARCH_FILTER: ${LDAP_SEARCH_FILTER:-(uid={{username}})}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-changeme}
    expose:
      - '3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        # Same-origin: the web app talks to /api and /ws/doc on the proxy.
        VITE_API_BASE: ''
    restart: unless-stopped
    expose:
      - '80'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - '8080:8080'
      # For a production domain, the Caddyfile switches to automatic HTTPS,
      # which needs ports 80 (ACME challenge) and 443 published as well:
      # - '80:80'
      # - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

  # Optional: a throwaway directory for trying LDAP login. Enable with
  # `docker compose --profile ldap up`.
  openldap:
    image: bitnami/openldap:2.6
    profiles: ['ldap']
    environment:
      LDAP_ROOT: dc=example,dc=org
      LDAP_ADMIN_USERNAME: admin
      LDAP_ADMIN_PASSWORD: admin
      LDAP_USERS: alice,bob
      LDAP_PASSWORDS: alicepw,bobpw
      LDAP_USER_DC: people
    ports:
      - '389:1389'

volumes:
  pgdata:
  caddydata:
  caddyconfig:
